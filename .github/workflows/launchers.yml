name: Launcher compatibility

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - v1.0.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    name: ${{ matrix.os }} / Python 3.10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64
      - name: Verify learning and progress behavior
        run: >-
          python -X utf8 -c "import pathlib, subprocess, sys; directory = pathlib.Path('terminal-results'); directory.mkdir(exist_ok=True); result = subprocess.run([sys.executable, '-X', 'utf8', '-m', 'unittest', 'discover', '-s', 'tests', '-v'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8'); (directory / 'behavior-tests.txt').write_text(result.stdout, encoding='utf-8'); print(result.stdout, end=''); sys.exit(result.returncode)"
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify built package content
        env:
          IELTS_CODEX_TEST_WHEEL_DIR: dist
        run: python -m unittest discover -s tests -p test_release.py -v
      - name: Verify packaged commands
        run: |
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', glob.glob('dist/ielts_codex-*.whl')[0]])"
          ielts --version
          ielts-codex --version
          python -c "from ielts_codex.updater import ProjectUpdater; assert ProjectUpdater().detect_install().kind == 'pip'"
      - name: Verify POSIX terminal interaction
        if: runner.os != 'Windows'
        run: python scripts/smoke_posix_terminal.py --report-dir terminal-results/posix
      - name: Verify Windows terminal interaction
        if: runner.os == 'Windows'
        run: python scripts/smoke_windows_terminal.py --installed --output terminal-results/windows
      - name: Verify Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: run.bat --version
      - name: Verify Windows command installer
        if: runner.os == 'Windows'
        shell: cmd
        env:
          IELTS_CODEX_INSTALL_DIR: ${{ runner.temp }}\ielts-command
        run: |
          call install.bat
          "%IELTS_CODEX_INSTALL_DIR%\ielts.cmd" --version
      - name: Verify Windows uv fallback
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\System32"
          set "IELTS_CODEX_BOOTSTRAP_DIR=%RUNNER_TEMP%\ielts-codex-bootstrap"
          echo y|run.bat --version
      - name: Verify Bash launcher
        if: runner.os != 'Windows'
        shell: bash
        run: ./run.sh --version
      - name: Verify Unix command installer
        if: runner.os != 'Windows'
        shell: bash
        env:
          IELTS_CODEX_INSTALL_DIR: ${{ runner.temp }}/ielts-command
        run: |
          ./install.sh
          "$IELTS_CODEX_INSTALL_DIR/ielts" --version
      - name: Preserve behavior and terminal reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.os }}
          path: terminal-results/
          if-no-files-found: warn
      - name: Preserve platform wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/ielts_codex-*.whl
          if-no-files-found: warn

  publish:
    name: Publish verified 1.0.0
    needs: launch
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.0.0' && needs.launch.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Download tested Ubuntu wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest
          path: release-dist
      - name: Verify release tag and package identity
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python scripts/check_release_tag.py --tag "$GITHUB_REF_NAME" --wheel release-dist/ielts_codex-1.0.0-py3-none-any.whl
      - name: Publish release and wheel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-dist/ielts_codex-1.0.0-py3-none-any.whl --verify-tag --title "IELTS Codex 1.0.0" --notes-file docs/releases/1.0.0.md
